# ============================================================
# CLIProxyAPI config.yaml — 接入 DeepSeek V4 API
# 版本要求: CLIProxyAPI v6.x+
# 项目地址: https://github.com/router-for-me/CLIProxyAPI
# ============================================================

# 服务端口
port: 8317

# 调试模式 (生产环境请改为 false)
debug: false

# 请求日志写入文件
logging-to-file: true

# 请求重试次数
request-retry: 3

# 认证文件存储目录
auth-dir: "~/.cli-proxy-api"

# ============================================================
# API 密钥 — 客户端通过此 Key 调用代理
# (Codex auth.json 里填这里设置的 key，不是 DeepSeek 原始 Key)
# ============================================================
api-keys:
  - "sk-cliproxyapi-my-key-2026"

# ============================================================
# OpenAI 兼容上游: DeepSeek V4
#   base_url (OpenAI):  https://api.deepseek.com
#   base_url (Anthropic): https://api.deepseek.com/anthropic
#   models: deepseek-v4-pro / deepseek-v4-flash
# ============================================================
openai-compatibility:
  - name: "deepseek"
    base-url: "https://api.deepseek.com/v1"
    api-key-entries:
      - api-key: "sk-你的DeepSeek-API-Key填这里"
    models:
      - name: "deepseek-v4-pro"
        alias: "deepseek-v4-pro"
      - name: "deepseek-v4-pro"
        alias: "gpt-5.4"
      - name: "deepseek-v4-flash"
        alias: "deepseek-v4-flash"
      - name: "deepseek-v4-flash"
        alias: "gpt-5.4-mini"

# ============================================================
# 删除 reasoning.effort — DeepSeek 对 Agent 请求自动启用 max
# ============================================================
payload:
  filter:
    - models:
        - name: "gpt-5.4"
        - name: "gpt-5.4-mini"
        - name: "deepseek-v4-pro"
        - name: "deepseek-v4-flash"
      params:
        - "reasoning.effort"
        - "reasoning_effort"
